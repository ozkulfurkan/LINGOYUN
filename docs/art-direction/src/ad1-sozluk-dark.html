<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="FONTS/fraunces/600.css"><link rel="stylesheet" href="FONTS/fraunces/400-italic.css"><link rel="stylesheet" href="FONTS/fraunces/600-italic.css"><link rel="stylesheet" href="FONTS/inter-tight/400.css"><link rel="stylesheet" href="FONTS/inter-tight/500.css"><link rel="stylesheet" href="FONTS/inter-tight/600.css">
<style>
:root{--paper:#0B121C;--ink:#E6EDF3;--mute:#7D8EA3;--rule:#22324A;--red:#3DD6C6;--hl:rgba(61,214,198,.28);--sheet:#111B28;--amber:#F2B33D}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#14263A,var(--paper) 60%);color:var(--ink);font-family:"Inter Tight";position:relative}
.tag{position:absolute;top:14px;left:0;right:0;text-align:center;font:600 10px "Inter Tight";letter-spacing:3px;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:56px 24px 12px;border-bottom:1px solid var(--rule);font:500 13px "Inter Tight";letter-spacing:.5px}
.top b{font:600 italic 18px Fraunces}
.prog{display:flex;gap:3px;padding:10px 24px 0}.prog i{flex:1;height:3px;background:var(--rule)}.prog i.on{background:var(--ink)}
.meta{display:flex;gap:10px;padding:26px 24px 0;font:600 11px "Inter Tight";letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.meta span:first-child{color:var(--red)}
.word{padding:6px 24px 0;font:600 64px/1 Fraunces;letter-spacing:-2px;font-variation-settings:"SOFT" 100}
.ipa{display:flex;align-items:center;gap:12px;padding:10px 24px 0;font:400 16px "Inter Tight";color:var(--mute)}
.ipa .s{width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.ex{margin:20px 24px 0;padding-left:14px;border-left:3px solid var(--red);font:400 italic 19px/1.4 Fraunces}
.ex em{font-style:italic;font-weight:600;background:linear-gradient(transparent 60%,var(--hl) 60%)}
.q{padding:26px 24px 8px;font:600 11px "Inter Tight";letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.o{display:flex;align-items:baseline;gap:16px;margin:0 24px;padding:14px 0;border-top:1px solid var(--rule);font:500 21px "Inter Tight"}
.o:last-of-type{border-bottom:1px solid var(--rule)}
.o i{font:400 italic 16px Fraunces;color:var(--mute);width:14px}
.o.ok{color:var(--red)} .o.ok span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.o.ok:after{content:"✓ doğru";margin-left:auto;font:600 12px "Inter Tight";letter-spacing:1.5px;text-transform:uppercase}
.foot{position:absolute;left:0;right:0;bottom:0;padding:18px 24px 30px;background:var(--sheet);border-top:1px solid var(--rule);color:var(--ink)}
.foot p{font:400 14px/1.45 "Inter Tight";opacity:.85}.foot p b{font:600 italic 17px Fraunces;opacity:1}
.foot .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.foot small{font:500 12px "Inter Tight";letter-spacing:.5px;opacity:.65}
.btn{background:var(--red);color:#0B121C;box-shadow:0 0 24px rgba(61,214,198,.3);padding:14px 30px;font:600 16px "Inter Tight";letter-spacing:.5px}
</style></head><body>
<div class="tag">YETİŞKİN — SÖZLÜK · KOYU MOD</div>
<div class="top"><span>✕</span><b>LINGOYUN</b><span style="color:var(--amber)">12 gün seri</span></div>
<svg style="display:block;margin:6px 0 0" width="390" height="30" viewBox="0 0 390 30"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3DD6C6" stop-opacity=".2"/><stop offset="1" stop-color="#3DD6C6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs>
<path d="M24 15 C60 4 90 26 130 15 S200 4 240 15 S310 26 366 12" stroke="#22324A" stroke-width="3" fill="none"/>
<path d="M24 15 C60 4 90 26 130 15 S200 4 222 13" stroke="url(#g)" stroke-width="6" fill="none" filter="url(#glow)"/>
<path d="M24 15 C60 4 90 26 130 15 S200 4 222 13" stroke="url(#g)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="222" cy="13" r="5" fill="#3DD6C6"/></svg>
<div class="meta"><span>B1</span><span>Duygular</span><span>8 / 15</span></div>
<div class="word">reluctant</div>
<div class="ipa"><div class="s"><svg width="13" height="12" viewBox="0 0 26 24"><path d="M2 8h6l7-6v20l-7-6H2z" fill="#E6EDF3"/></svg></div>/rɪˈlʌktənt/ · sıfat</div>
<div class="ex">She was <em>reluctant</em> to leave the party early.</div>
<div class="q">Türkçe karşılığı</div>
<div class="o ok"><i>a</i><span>isteksiz</span></div>
<div class="o"><i>b</i><span>dikkatli</span></div>
<div class="o"><i>c</i><span>kararlı</span></div>
<div class="o"><i>d</i><span>utangaç</span></div>
<div class="foot"><p><b>isteksiz, gönülsüz.</b> “reluctant to do sth” kalıbıyla kullanılır.</p><div class="row"><small>Tekrar: 3 gün sonra</small><div class="btn">Devam →</div></div></div>
</body></html>
