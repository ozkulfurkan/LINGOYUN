<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="FONTS/dm-serif-display/400.css"><link rel="stylesheet" href="FONTS/dm-serif-display/400-italic.css"><link rel="stylesheet" href="FONTS/manrope/500.css"><link rel="stylesheet" href="FONTS/manrope/700.css"><link rel="stylesheet" href="FONTS/manrope/800.css">
<style>
:root{--ivory:#FAF6EE;--card:#FFFFFF;--indigo:#1D2B6B;--ink:#1A2148;--mute:#7C7F95;--line:#E9E1D2;--turq:#1FA6A6;--coral:#EE6C4D;--saffron:#F2B33D}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--ivory);color:var(--ink);font-family:Manrope;position:relative}
.tag{position:absolute;top:14px;left:0;right:0;text-align:center;font:800 10px Manrope;letter-spacing:3px;color:var(--mute)}
.top{display:flex;align-items:center;gap:14px;padding:54px 22px 0}
.x{font:700 18px Manrope;color:var(--mute)}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:53%;border-radius:4px;background:var(--indigo)}
.st{display:flex;align-items:center;gap:5px;font:800 14px Manrope;color:var(--coral)}
.card{margin:22px 22px 0;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 18px 40px -20px rgba(29,43,107,.35)}
.strip{height:64px;position:relative}
.strip span{position:absolute;left:18px;bottom:10px;font:800 11px Manrope;letter-spacing:2px;color:#fff;background:rgba(29,43,107,.55);padding:5px 9px;border-radius:8px;backdrop-filter:blur(4px)}
.body{padding:16px 20px 20px}
.word{display:flex;justify-content:space-between;align-items:center;font:400 52px/1 "DM Serif Display";color:var(--indigo)}
.spk{width:46px;height:46px;border-radius:50%;background:var(--ivory);border:1.5px solid var(--line);display:grid;place-items:center}
.ipa{margin-top:6px;font:500 14px Manrope;color:var(--mute)}
.ex{margin-top:14px;font:400 italic 19px/1.35 "DM Serif Display";color:#3A4170}
.ex b{font-weight:400;color:var(--coral)}
.q{padding:22px 24px 10px;font:800 11px Manrope;letter-spacing:2px;color:var(--mute)}
.opts{display:grid;gap:10px;padding:0 22px}
.o{height:56px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:flex-start;padding:0 20px;font:700 17px Manrope;position:relative;overflow:hidden}
.o.ok{border-color:var(--turq);color:#fff;background:var(--turq)}
.o.ok svg{position:absolute;inset:0;opacity:.55}.o.ok span{position:relative}
.fb{position:absolute;left:22px;right:22px;bottom:30px}
.fb .msg{display:flex;align-items:center;gap:12px;padding:0 4px 14px}
.dot{width:36px;height:36px;border-radius:50%;background:var(--turq);display:grid;place-items:center;flex:none}
.fb h4{font:700 16px Manrope}.fb p{font:500 13px Manrope;color:var(--mute)}
.btn{height:58px;border-radius:18px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:800 17px Manrope}
.btn small{font:600 12px Manrope;opacity:.7}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>

<div class="card"><div class="strip"><svg width="346" height="64" viewBox="0 0 346 64" preserveAspectRatio="none"><rect width="346" height="64" fill="#1D2B6B"/><g filter="url(#m)"><path d="M-20 14 C60 0 120 30 200 14 S320 4 370 18 V28 C300 18 240 40 160 28 S30 22 -20 34Z" fill="#1FA6A6"/><path d="M-20 40 C70 28 150 54 230 40 S330 34 370 44 V52 C300 46 230 64 150 54 S40 50 -20 58Z" fill="#EE6C4D"/><path d="M-20 56 C80 50 160 70 240 60 S340 58 370 62 V80 H-20Z" fill="#F2B33D"/></g></svg><span>B1 · DUYGULAR</span></div>
<div class="body"><div class="word">reluctant<div class="spk"><svg width="18" height="16" viewBox="0 0 26 24"><path d="M2 8h6l7-6v20l-7-6H2z" fill="#1D2B6B"/><path d="M19 6c3 3 3 9 0 12" stroke="#1D2B6B" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></div></div>
<div class="ipa">/rɪˈlʌktənt/ · sıfat</div><div class="ex">“She was <b>reluctant</b> to leave the party early.”</div></div></div>
<div class="q">TÜRKÇE KARŞILIĞI</div>
<div class="opts"><div class="o ok"><svg viewBox="0 0 160 58" preserveAspectRatio="none"><g filter="url(#m)"><path d="M-10 40 C40 26 80 52 120 38 S160 30 170 36 V70 H-10Z" fill="#2FC0BC"/><path d="M-10 50 C40 42 90 62 130 50 S165 46 170 50 V70 H-10Z" fill="#F2B33D"/></g></svg><span>isteksiz ✓</span></div><div class="o">dikkatli</div><div class="o">kararlı</div><div class="o">utangaç</div></div>
<div class="fb"><div class="msg"><div class="dot"><svg width="18" height="18" viewBox="0 0 22 22"><path d="M5 11l4 4 8-8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></div><div><h4>Doğru: isteksiz, gönülsüz</h4><p>“reluctant to do something” kalıbıyla kullanılır.</p></div></div>

</body></html>
