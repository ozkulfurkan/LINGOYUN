<!-- LINGOYUN app glyph: three clay stepping stones across a river, from one
     language's bank to the other. Colours mirror kidsTheme (src/theme/themes.ts).
     Edit here, then run: node scripts/generate-icons.mjs -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="river" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E9F7A"/>
      <stop offset="1" stop-color="#4CC9A0"/>
    </linearGradient>
    <radialGradient id="lemon" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0.45" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#E0AE16"/>
    </radialGradient>
    <radialGradient id="berry" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0.45" stop-color="#E64570"/>
      <stop offset="1" stop-color="#B8325A"/>
    </radialGradient>
    <radialGradient id="sky" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0.45" stop-color="#7FC8FF"/>
      <stop offset="1" stop-color="#4A9BDB"/>
    </radialGradient>
  </defs>
  <path class="river" transform="translate(0 -110)" d="M-60 600 C 160 520 300 700 520 540 C 720 400 840 400 1084 180 L 1084 500 C 860 680 740 660 540 820 C 320 990 160 820 -60 940 Z" fill="url(#river)"/>
  <path class="river" transform="translate(0 -110)" d="M40 790 C 220 700 330 840 520 690 C 700 550 820 560 1000 380" fill="none" stroke="#FFF6EC" stroke-opacity="0.55" stroke-width="22" stroke-linecap="round" stroke-dasharray="4 70"/>
  <ellipse class="shade" cx="250" cy="770" rx="130" ry="34" fill="#4A2C2A" fill-opacity="0.16"/>
  <circle cx="250" cy="690" r="128" fill="url(#lemon)"/>
  <ellipse cx="200" cy="630" rx="40" ry="26" fill="#FFF6EC" fill-opacity="0.7"/>
  <ellipse class="shade" cx="520" cy="600" rx="140" ry="36" fill="#4A2C2A" fill-opacity="0.16"/>
  <circle cx="520" cy="512" r="142" fill="url(#berry)"/>
  <ellipse cx="465" cy="445" rx="44" ry="28" fill="#FFF6EC" fill-opacity="0.7"/>
  <ellipse class="shade" cx="790" cy="420" rx="120" ry="32" fill="#4A2C2A" fill-opacity="0.16"/>
  <circle cx="790" cy="346" r="118" fill="url(#sky)"/>
  <ellipse cx="744" cy="290" rx="36" ry="24" fill="#FFF6EC" fill-opacity="0.7"/>
</svg>
